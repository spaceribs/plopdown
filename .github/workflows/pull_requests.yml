name: Pull Request Check
on:
  pull_request:
    branches:
      - master

# Every job needs the toolchain step. The lint/build/test jobs previously had
# no setup step at all and silently ran on whatever Node the runner image
# shipped. The versions now come from .prototools, so there is nothing to keep
# in step here -- pinning lives in one file for CI and contributors alike.

jobs:
  setup:
    name: Checkout and Install
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup toolchain
        uses: moonrepo/setup-toolchain@v0
        with:
          auto-install: true

      - name: Cache .npm
        id: cache-npm
        uses: actions/cache@v6
        with:
          path: |-
            ~/.npm
            node_modules
            dist
          key: ${{ runner.os }}-npm-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Install Dependencies
        if: steps.cache-npm.outputs.cache-hit != 'true' && steps.cache-node.outputs.cache-hit != 'true'
        run: npm ci

  lint:
    name: Lint Affected
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup toolchain
        uses: moonrepo/setup-toolchain@v0
        with:
          auto-install: true

      - name: Cache node_modules
        uses: actions/cache@v6
        with:
          path: |-
            ~/.npm
            node_modules
            dist
          key: ${{ runner.os }}-npm-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Lint Affected Projects
        run: npm run ci:lint

  build:
    name: Build Affected
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup toolchain
        uses: moonrepo/setup-toolchain@v0
        with:
          auto-install: true

      - name: Cache node_modules
        uses: actions/cache@v6
        with:
          path: |-
            ~/.npm
            node_modules
            dist
          key: ${{ runner.os }}-npm-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Build Affected Projects
        run: npm run ci:build

  test:
    name: Test Affected
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup toolchain
        uses: moonrepo/setup-toolchain@v0
        with:
          auto-install: true

      - name: Cache node_modules
        uses: actions/cache@v6
        with:
          path: |-
            ~/.npm
            node_modules
            dist
          key: ${{ runner.os }}-npm-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Test Affected Projects
        run: npm run ci:test
