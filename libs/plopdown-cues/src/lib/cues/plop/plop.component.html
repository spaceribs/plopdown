@if (data && data.icons && data.icons.length) {
<div class="pd-icons">
  @for (icon of data.icons; track icon) {
  <div
    [ngStyle]="{
      fontSize: icon.size + '%',
      top: icon.top + '%',
      left: icon.left + '%',
      transform: 'rotate(' + icon.rotate + 'deg)'
    }"
    class="pd-icon"
  >
    {{ icon.emoji }}‍
  </div>
  }
</div>
} @if (data) {
<div class="desc">
  {{ data.desc }}
  @if (data.footnotes) {
  <ul class="footnotes">
    @for (footnote of data.footnotes; track footnote; let i = $index) {
    <li class="footnote">
      <a
        [title]="footnote.title"
        [href]="footnote.url"
        rel="noopener noreferrer"
        target="_blank"
        >[{{ i + 1 }}]</a
      >
    </li>
    }
  </ul>
  }
</div>
}
