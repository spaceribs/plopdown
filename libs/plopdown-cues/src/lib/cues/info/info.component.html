@if (data) {
<h3>
  @if (data.url) {
  <a [href]="data.url" rel="noreferrer noopener" target="_blank">{{
    data.title
  }}</a>
  } @if (!data.url) {
  {{ data.title }}
  }
</h3>
<h4>
  Annotated By: @if (data.authors.length < 1) {
  <span>Anonymous</span>
  } @for (author of data.authors; track $index; let isLast = $last) {
  <span>{{ author }}</span
  >{{ isLast ? '' : ', ' }}
  }
</h4>
}
