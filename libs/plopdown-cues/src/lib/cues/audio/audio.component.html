@if (audioUrl) {
<video plopdown-ignore #audioElem [src]="audioUrl" hidden="true"></video>
} @if (data) {
<div
  class="indicator-container"
  [ngStyle]="{ 'top.%': data.top, 'left.%': data.left }"
>
  <div class="audio-indicator">
    <svg class="progress-ring" viewbox="0 0 120 120">
      <circle
        [ngStyle]="progressStyle$ | async"
        stroke="white"
        stroke-width="8%"
        stroke-dasharray="8% 8%"
        fill="transparent"
        class="progress-ring__circle"
        cx="50%"
        cy="50%"
        r="45%"
      ></circle>
    </svg>
    <a title="Mute/Unmute Audio" href="#" (click)="toggleMute($event)">
      @if (audioMuted) {
      <plopdown-icon [path]="mdiVolumeOff"></plopdown-icon>
      } @else {
      <plopdown-icon [path]="mdiVolumeHigh"></plopdown-icon>
      }
    </a>
  </div>
  @if (data) {
  <div class="title-box">
    <div class="title">{{ data.title }}</div>
  </div>
  }
</div>
}
